services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/crm.db
      WA_DB_PATH: /app/data/wa.db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-test@mail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-securepassword}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://192.168.0.36:8080/api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped